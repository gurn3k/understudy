name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # check_claims.mjs uses Node's built-in fetch and WebSocket (Node 22 or later); no packages are installed.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Unit tests
        run: python -m unittest -v
      - name: Term scan
        run: python tools/term_scan.py
      - name: Claims and input checks (serve site/ and read the pages in headless Chrome)
        env:
          CHROME: google-chrome
          # The runner's Chrome can't use its sandbox on Ubuntu 24.04; the page served is this repo's own site/.
          CHROME_ARGS: --no-sandbox
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory site > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8765/ && break; sleep 1; done
          google-chrome --version
          node tools/check_claims.mjs http://127.0.0.1:8765/
          node tools/check_inputs.mjs http://127.0.0.1:8765/
